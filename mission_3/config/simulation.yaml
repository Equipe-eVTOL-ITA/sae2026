# Mission 1 — Simulation parameters
# These are loaded by ROS2 launch files via:
#   Node(parameters=[os.path.join(pkg_dir, "config", "simulation.yaml")])

mission_3_node:
  ros__parameters:
    # TAKEOFF
    takeoff_height: -2.0
    max_vertical_velocity: 1.2
    position_tolerance: 0.2

    # LANDING
    landing_velocity_max: 0.5
    landing_velocity_min: 0.1
    max_base_height: 0.5
    landing_timeout: 5.0

    # MOVEMENT
    max_horizontal_velocity: 1.5
    position_tolerance_mov: 0.1

    # ALIGN
    position_tolerance_align: 0.10
    max_horizontal_velocity_align: 0.4

    # LIMIT
    limit_value: 50.0

    # WAYPOINTS
    x1: 2.0
    y1: 6.0
    z1: -2.1
    x2: -2.5
    y2: 0.0
    z2: -2.1
    x3: 2.5
    y3: -5.0
    z3: 5.0
    x4: 2.1
    y4: 2.5
    z4: -2.1