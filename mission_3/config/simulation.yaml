# Mission 1 — Simulation parameters
# These are loaded by ROS2 launch files via:
#   Node(parameters=[os.path.join(pkg_dir, "config", "simulation.yaml")])

fase_3_node:
  ros__parameters:
    # TAKEOFF
    takeoff_height: -2.0
    max_vertical_velocity: 1.2
    position_tolerance: 0.2

    # LANDING
    landing_velocity_max: 0.5
    landing_velocity_min: 0.15
    max_base_height: 0.5
    landing_timeout: 5.0

    # MOVEMENT
    max_horizontal_velocity: 0.5
    position_tolerance_mov: 0.1

    # ALIGN
    position_tolerance_align: 0.12
    max_horizontal_velocity_align: 0.25
    align_kp: 0.5
    align_kd: 0.09
    align_min_detections: 6.0

    # SEARCH
    max_horizontal_velocity_search: 0.3
    position_tolerance_search: 0.1
    step: 0.7

    # APPROACH
    manometer_approach_altitude: -2.0
    approach_velocity: 0.3
    approach_hold_ticks:   20.0   # motor stabilisation after reaching altitude (~1s)
    approach_settle_ticks: 40.0   # sensor stabilisation before PHOTO (~2s)

    # LIMIT
    limit_value: 50.0 # valor limite do manometro indicado pela competição

    # WAYPOINTS
    x1: -6.2
    y1: -2.0
    z1: -2.2
    x2: 0.0
    y2: 2.5
    z2: -2.2
    x3: 5.0
    y3: -2.5
    z3: -2.2
    # Waypoint 4: return to takeoff origin before landing
    x4: 0.0
    y4: 0.0
    z4: -2.2

manometro_detector:
  ros__parameters:
    # Rotation correction: 0 now that the MIN-diff selection is fixed.
    rotation_correction_deg: 0.0
    # Pointer angle (math convention: 0=right, CCW+) when pressure = 0 and 100.
    # Physical: 240° = 0 pressure (upper-left), -60° = 100 pressure (lower-right).
    angle_at_0:   240.0
    angle_at_100: -60.0