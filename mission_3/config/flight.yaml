# Mission 1 — Simulation parameters
# These are loaded by ROS2 launch files via:
#   Node(parameters=[os.path.join(pkg_dir, "config", "simulation.yaml")])

fase_3_node:
  ros__parameters:
    # TAKEOFF
    takeoff_height: -2.0
    max_vertical_velocity: 1.2
    position_tolerance: 0.2

    # LANDING
    landing_velocity_max: 0.5
    landing_velocity_min: 0.15
    max_base_height: 0.5
    landing_timeout: 5.0

    # MOVEMENT
    max_horizontal_velocity: 0.5
    position_tolerance_mov: 0.1

    # ALIGN
    position_tolerance_align: 0.10
    max_horizontal_velocity_align: 0.3
    align_kp: 0.5
    align_kd: 0.07
    align_min_detections: 6.0

    # SEARCH
    max_horizontal_velocity_search: 0.3
    position_tolerance_search: 0.1
    step: 0.7
    
    # APPROACH
    manometer_approach_altitude: -1.9
    approach_velocity: 0.3
    approach_hold_ticks: 20.0

    # LIMIT
    limit_value: 50.0

    # WAYPOINTS
    x1: -6.2
    y1: -2.0
    z1: -2.2
    x2: 0.0
    y2: 2.5
    z2: -2.2
    x3: 5.0
    y3: -2.5
    z3: -2.2
    x4: -5.0
    y4: -2.5
    z4: -2.2

manometro_detector:
  ros__parameters:
    # Extra rotation applied after best_rot*90 to compensate for camera mounting.
    # Use 0 / 90 / 180 / 270. Default 180: inset was upside-down.
    rotation_correction_deg: 180.0
    # Pointer angle (math convention: 0=right, CCW+) when pressure = 0 and 100.
    # Calibrated from flight data:
    #   @10% → angulo≈74°  |  @30% → angulo≈42°
    #   (A0-74)/(A0-42)=1/3 → A0=90° ; sweep=160° → A100=-70°
    #   Predicted: @90% → angulo≈-54°
    angle_at_0:   90.0
    angle_at_100: -70.0