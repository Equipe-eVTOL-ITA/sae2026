mangueira_detector:
  ros__parameters:
    image_topic: '/vertical_camera/compressed'
    processing_frequency: 10.0  # Hz
    confidence_threshold: 0.5

    # Hose detection parameters
    min_hose_area: 50
    max_hose_area: 1000
    morph_kernel_size: 3
    morph_iterations: 2

    # Hose shape constraints
    min_aspect_ratio: 0.0
    max_aspect_ratio: 200.0
    min_hose_length: 1
    max_hose_width: 800

    # Red hose HSV (Range 1: pure red, H=0-12°)
    # Expanded from 0-10 to 0-12 to catch slightly warmer reds.
    # S_min raised from 50 to 90: environment background has S mean≈94,
    # so 90 excludes most of it while still catching saturated hose.
    red_lower1_h: 0
    red_lower1_s: 90
    red_lower1_v: 40
    red_upper1_h: 12
    red_upper1_s: 255
    red_upper1_v: 255

    # Red hose HSV (Range 2: red wrap-around, H=165-180°)
    # Corrected upper bound from 200 to 180 (OpenCV H max is 179).
    red_lower2_h: 165
    red_lower2_s: 90
    red_lower2_v: 40
    red_upper2_h: 180
    red_upper2_s: 255
    red_upper2_v: 255

    # ---- Telemetry / debug image tuning ----
    # Set debug_image / debug_mask to false to fully silence the debug topics.
    debug_image: true
    debug_mask: true
    debug_publish_rate: 10.0   # Hz; <=0 publishes every processed frame
    debug_max_width: 240      # px; <=0 keeps detector resize_width
    debug_jpeg_quality: 60    # 1..100
