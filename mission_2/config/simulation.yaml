# Mission 2 — Simulation parameters
# These are loaded by ROS2 launch files via:
#   Node(parameters=[os.path.join(pkg_dir, "config", "simulation.yaml")])

mission_2_node:
  ros__parameters:
    # Takeoff
    takeoff_height: -2.5
    max_vertical_velocity: 1.2
    position_tolerance: 0.15

    # Landing
    landing_velocity_max: 0.5
    landing_velocity_min: 0.15
    max_base_height: 0.5
    landing_timeout: 5.0

    # Movement
    max_horizontal_velocity: 1.5

    # Mission 2 Parameters
    search_yaw_rate: 0.5
    search_radius: 3.0
    ball_trigger_score: 5000.0
    ball_approach_velocity: 0.2
    ball_kp_x: 0.5
    ball_ki_x: 0.0
    ball_kd_x: 0.1
    ball_kp_y: 0.5
    ball_ki_y: 0.0
    ball_kd_y: 0.1
    rise_delta_z: 0.5
    align_tolerance_y: 0.1
    align_tolerance_yaw: 0.05
    align_kp_y: 0.5
    align_ki_y: 0.0
    align_kd_y: 0.1
    align_kp_yaw: 0.5
    align_ki_yaw: 0.0
    align_kd_yaw: 0.1
    hook_script_path: "/home/marconipavan/evtol/dev/scripts/drop_hook.py"
    target_x: 0.0
    target_y: 0.0
    target_z: -2.0
    target_yaw: 0.0
