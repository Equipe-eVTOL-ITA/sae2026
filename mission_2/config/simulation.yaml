# Mission 2 — Simulation parameters
# These are loaded by ROS2 launch files via:
#   Node(parameters=[os.path.join(pkg_dir, "config", "simulation.yaml")])

mission_2_node:
  ros__parameters:
    # Takeoff
    takeoff_height: -1.5
    max_vertical_velocity: 1.2
    position_tolerance: 0.15

    # Landing
    landing_velocity_max: 0.5
    landing_velocity_min: 0.15
    max_base_height: 0.5
    landing_timeout: 5.0

    # Movement
    max_horizontal_velocity: 1.5

    # Mission 2 Parameters
    search_speed: 0.5
    search_radius: 1.6
    ball_trigger_score: 18000.0    # area maior => GOTO_BALL segue mais perto da bola
    ball_distance_scale: 100.0
    ball_min_area: 100.0
    ball_max_area: 30000.0
    ball_confirm_frames: 1.0       # bola passa 1 frame pelo FOV antes de sair — não aguardar 3
    ball_miss_frames: 10.0
    ball_centering_threshold: 0.15
    ball_centering_kp: 0.8         # radianos de offset de yaw por unidade de x_error (sem fator dt)
    ball_centering_frames: 5.0
    ball_centering_miss_tol: 10.0  # mais paciência antes de desistir (era 5)
    ball_lookat_x_tolerance: 0.12
    ball_lookat_y_tolerance: 0.10
    ball_lookat_frames: 5.0
    ball_lookat_yaw_kp: 0.45
    ball_lookat_alt_kp: 0.25
    ball_lookat_max_yaw_step: 0.12
    ball_lookat_max_vertical_step: 0.08
    ball_approach_velocity: 0.5
    ball_kp_x: 0.5
    ball_ki_x: 0.0
    ball_kd_x: 0.1
    ball_kp_y: 0.5
    ball_ki_y: 0.0
    ball_kd_y: 0.1
    rise_target_z: -3.0
    rise_climb_rate: 0.3
    align_tolerance_y: 0.1
    align_tolerance_yaw: 0.05
    align_kp_y: 0.5
    align_ki_y: 0.0
    align_kd_y: 0.1
    align_kp_yaw: 0.5
    align_ki_yaw: 0.0
    align_kd_yaw: 0.1
    hose_approach_speed: 0.2
    hook_script_path: "~/evtol/dev/scripts/drop_hook.py"
    target_x: 0.0
    target_y: 0.0
    target_z: -2.0
    target_yaw: 0.0
